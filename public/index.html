<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Video Call App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 10px; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        video { width: 450px; height: 340px; background: #1e293b; border-radius: 8px; object-fit: cover; border: 2px solid #334155; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: #fff; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <h1>Python + WebRTC Video Call</h1>
    <div class="controls">
        <button onclick="startCamera()">1. Start Camera</button>
        <button onclick="createOffer()">2. Create Offer</button>
        <button onclick="createAnswer()">3. Answer Call</button>
    </div>

    <div style="margin-top: 15px; width: 80%; max-width: 900px; display: flex; flex-direction: column; gap: 10px;">
        <textarea id="offerAnswerBox" placeholder="Paste SDP offer/answer code here..." style="width: 100%; height: 80px; background: #1e293b; color: #fff; padding: 10px; border-radius: 5px; border: 1px solid #334155;"></textarea>
        <button onclick="setRemoteDescription()" style="background: #10b981;">Set Remote SDP</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Stream</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Remote Stream</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let remoteStream;
        let peerConnection;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                // Explicitly assign stream to local video element
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;

                peerConnection = new RTCPeerConnection(servers);
                
                // Add local tracks to peer connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                // Set up remote stream listener
                remoteStream = new MediaStream();
                document.getElementById('remoteVideo').srcObject = remoteStream;
                
                peerConnection.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                };

                alert('Camera successfully started and ready!');
            } catch (error) {
                console.error('Media error:', error);
                alert('Could not access camera. Check HTTPS or browser permissions.');
            }
        }

        async function createOffer() {
            if (!peerConnection) return alert('Start camera first!');
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            document.getElementById('offerAnswerBox').value = JSON.stringify(peerConnection.localDescription);
            alert('Offer created! Copy and send to the other user.');
        }

        async function createAnswer() {
            if (!peerConnection) return alert('Start camera first!');
            const text = document.getElementById('offerAnswerBox').value;
            if (!text) return alert('Paste offer text first!');
            
            await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(text)));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            document.getElementById('offerAnswerBox').value = JSON.stringify(peerConnection.localDescription);
            alert('Answer created! Copy and send back to the caller.');
        }

        async function setRemoteDescription() {
            if (!peerConnection) return alert('Start camera first!');
            const text = document.getElementById('offerAnswerBox').value;
            if (!text) return alert('Paste SDP text first!');
            
            if (!peerConnection.currentRemoteDescription) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(text)));
                alert('Remote description successfully set!');
            }
        }
    </script>
</body>
</html>
