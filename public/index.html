<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call - Create or Join Room</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 5px; }
        p { color: #94a3b8; margin-top: 0; }
        .panels-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 900px; }
        .panel { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 10px; }
        .panel h3 { margin-top: 0; color: #38bdf8; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        video { width: 420px; height: 320px; background: #1e293b; border-radius: 8px; object-fit: cover; border: 2px solid #334155; }
        input, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #0f172a; color: #fff; border: 1px solid #475569; }
        button { background: #3b82f6; color: #fff; cursor: pointer; }
        button:hover { background: #2563eb; }
        .hangup-btn { background: #ef4444; margin-top: 20px; width: 200px; }
        .hangup-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <h1>Python WebRTC Video Call</h1>
    <p>Create a new room or join an existing room code.</p>

    <div class="panels-container">
        <!-- Section 1: Create Room -->
        <div class="panel">
            <h3>1. Create Room</h3>
            <input type="text" id="createRoomInput" placeholder="Enter new room code">
            <button onclick="createRoom()">Create & Host</button>
        </div>

        <!-- Section 2: Join Room -->
        <div class="panel">
            <h3>2. Join Room</h3>
            <input type="text" id="joinRoomInput" placeholder="Enter existing room code">
            <button onclick="startJoinProcess()" style="background: #10b981;">Join Room</button>
        </div>
    </div>

    <button class="hangup-btn" onclick="hangUp()" style="display:none;" id="hangupBtn">Leave Call</button>

    <div class="video-container">
        <div>
            <h4>Local Stream</h4>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h4>Remote Stream</h4>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let remoteStream;
        let peerConnection;
        let pollTimer;
        let activeRoomId = null;
        let isCaller = false;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function initMedia() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            remoteStream = new MediaStream();
            document.getElementById('remoteVideo').srcObject = remoteStream;

            peerConnection.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && activeRoomId) {
                    sendSignal(activeRoomId, 'candidate', event.candidate);
                }
            };
        }

        async function createRoom() {
            const roomId = document.getElementById('createRoomInput').value.trim();
            if (!roomId) {
                alert('Please enter a valid room code to create.');
                return;
            }
            activeRoomId = roomId;
            isCaller = true;

            try {
                await initMedia();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                await sendSignal(roomId, 'offer', offer);

                startPolling(roomId);
                document.getElementById('hangupBtn').style.display = 'block';
                alert('Room created successfully! Waiting for a peer to join...');
            } catch (err) {
                console.error('Error creating room:', err);
                alert('Could not initialize camera or create room.');
            }
        }

        async function startJoinProcess() {
            const roomId = document.getElementById('joinRoomInput').value.trim();
            if (!roomId) {
                alert('Please enter a valid room code to join.');
                return;
            }
            activeRoomId = roomId;
            isCaller = false;

            try {
                await initMedia();
                alert('Searching for room... Please make sure the host has created it.');
                
                // Poll until the host's offer appears
                pollTimer = setInterval(async () => {
                    const res = await fetch(`/api/signal/${roomId}`);
                    if (!res.ok) return;
                    const roomData = await res.json();

                    if (roomData.offer && !peerConnection.currentRemoteDescription) {
                        clearInterval(pollTimer);
                        
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));

                        if (roomData.candidates) {
                            roomData.candidates.forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c)));
                        }

                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        await sendSignal(roomId, 'answer', answer);

                        startPolling(roomId);
                        document.getElementById('hangupBtn').style.display = 'block';
                        alert('Joined room successfully!');
                    }
                }, 2000);

            } catch (err) {
                console.error('Error joining room:', err);
                alert('Could not connect to the room.');
            }
        }

        async function sendSignal(roomId, type, data) {
            await fetch('/api/signal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_id: roomId, type: type, data: data })
            });
        }

        function startPolling(roomId) {
            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`/api/signal/${roomId}`);
                    if (!res.ok) return;
                    const roomData = await res.json();

                    if (isCaller && roomData.answer && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.answer));
                    }

                    if (roomData.candidates) {
                        for (let c of roomData.candidates) {
                            try {
                                await peerConnection.addIceCandidate(new RTCIceCandidate(c));
                            } catch (e) {}
                        }
                    }
                } catch (e) {}
            }, 2000);
        }

        async function hangUp() {
            if (activeRoomId) {
                await fetch(`/api/signal/${activeRoomId}`, { method: 'DELETE' });
            }
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            if (pollTimer) clearInterval(pollTimer);
            window.location.reload();
        }
    </script>
</body>
</html>
