<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room-based Video Call</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        video { width: 450px; height: 340px; background: #1e293b; border-radius: 8px; object-fit: cover; border: 2px solid #334155; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: #fff; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <h1>Room-based Video Call App</h1>
    <div class="controls">
        <input type="text" id="roomInput" placeholder="Enter Room ID">
        <button onclick="joinRoom()">Join Room & Connect</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Stream</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Remote Stream</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let remoteStream;
        let peerConnection;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function joinRoom() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                alert('Please enter a valid Room ID');
                return;
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(servers);
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                remoteStream = new MediaStream();
                document.getElementById('remoteVideo').srcObject = remoteStream;

                peerConnection.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                };

                peerConnection.onicecandidate = async (event) => {
                    if (event.candidate) {
                        // Push updated description containing candidates
                        await sendSignal(roomId, { type: peerConnection.localDescription.type, sdp: peerConnection.localDescription.sdp });
                    }
                };

                // Check if room already has an offer (Caller vs Receiver check)
                const response = await fetch(`/api/signal/get/${roomId}`);
                if (response.ok) {
                    // Room exists, we are the Answerer
                    const data = await response.json();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    await sendSignal(roomId, { type: answer.type, sdp: answer.sdp });
                    alert('Connected to room as Answerer!');
                } else {
                    // Room does not exist, we are the Caller
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    await sendSignal(roomId, { type: offer.type, sdp: offer.sdp });
                    alert('Room created! Waiting for peer to join...');

                    // Poll for answer
                    pollForAnswer(roomId);
                }

            } catch (error) {
                console.error('Connection error:', error);
                alert('Error establishing connection.');
            }
        }

        async function sendSignal(roomId, data) {
            await fetch('/api/signal/set', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_id: roomId, data: data })
            });
        }

        function pollForAnswer(roomId) {
            const interval = setInterval(async () => {
                const response = await fetch(`/api/signal/get/${roomId}`);
                if (response.ok) {
                    const result = await response.json();
                    if (result.data.type === 'answer' && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(result.data));
                        clearInterval(interval);
                        alert('Peer joined and connected successfully!');
                    }
                }
            }, 2000);
        }
    </script>
</body>
</html>
