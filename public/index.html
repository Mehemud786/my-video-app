<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Room Code Video Call</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 5px; }
        p { color: #94a3b8; margin-top: 0; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        video { width: 450px; height: 340px; background: #1e293b; border-radius: 8px; object-fit: cover; border: 2px solid #334155; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: #fff; cursor: pointer; }
        button:hover { background: #2563eb; }
        .hangup { background: #ef4444; }
        .hangup:hover { background: #dc2626; }
    </style>
</head>
<body>

    <h1>Secure Video Call</h1>
    <p>Enter any shared Room Code to connect with your peer directly.</p>

    <div class="controls">
        <input type="text" id="roomInput" placeholder="e.g. room-xyz-123">
        <button onclick="joinRoom()">Join Room</button>
        <button class="hangup" onclick="hangUp()">Leave Call</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Stream</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Remote Stream</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let remoteStream;
        let peerConnection;
        let pollingInterval;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function joinRoom() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (!roomId) {
                alert('Please enter a valid Room Code!');
                return;
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;

                peerConnection = new RTCPeerConnection(servers);
                
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                remoteStream = new MediaStream();
                document.getElementById('remoteVideo').srcObject = remoteStream;

                peerConnection.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                };

                // Check if the room already has an active offer
                const checkRes = await fetch(`/api/signal/get/${roomId}`);
                
                if (checkRes.ok) {
                    // Room exists: We are the Answerer
                    const roomData = await checkRes.json();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.data));
                    
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    
                    await sendSignal(roomId, { type: answer.type, sdp: answer.sdp });
                    alert('Joined room successfully as Answerer!');
                } else {
                    // Room is empty: We are the Caller
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    
                    await sendSignal(roomId, { type: offer.type, sdp: offer.sdp });
                    alert('Room created! Waiting for peer to join using code: ' + roomId);

                    // Periodically look for the peer's answer response
                    pollingInterval = setInterval(() => pollForAnswer(roomId), 2000);
                }

            } catch (error) {
                console.error('Media/Connection initialization error:', error);
                alert('Failed to connect. Check camera settings and HTTPS.');
            }
        }

        async function sendSignal(roomId, data) {
            await fetch('/api/signal/set', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_id: roomId, data: data })
            });
        }

        async function pollForAnswer(roomId) {
            try {
                const res = await fetch(`/api/signal/get/${roomId}`);
                if (res.ok) {
                    const result = await res.json();
                    if (result.data.type === 'answer' && !peerConnection.currentRemoteDescription) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(result.data));
                        clearInterval(pollingInterval);
                        alert('Peer connected successfully!');
                    }
                }
            } catch (e) {
                console.error('Polling error:', e);
            }
        }

        async function hangUp() {
            const roomId = document.getElementById('roomInput').value.trim();
            if (roomId) {
                await fetch(`/api/signal/clear/${roomId}`, { method: 'DELETE' });
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peerConnection) {
                peerConnection.close();
            }
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
            window.location.reload();
        }
    </script>
</body>
</html>
