<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P2P Video Call</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #0f172a; color: white; }
    .video-grid { display: flex; gap: 20px; margin-top: 20px; }
    video { width: 360px; height: 270px; background: #1e293b; border-radius: 8px; object-fit: cover; }
    .controls { display: flex; gap: 10px; margin-top: 15px; }
    button, input { padding: 8px 14px; border-radius: 6px; border: none; font-size: 14px; }
    button { background: #3b82f6; color: white; cursor: pointer; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h2>Direct Video Call</h2>
  <div>Your ID: <span id="my-id" style="font-weight:bold; color: #38bdf8;">Connecting...</span></div>

  <div class="controls">
    <input type="text" id="peer-id" placeholder="Enter remote peer ID">
    <button onclick="makeCall()">Call</button>
  </div>

  <div class="video-grid">
    <div>
      <p>Local Video</p>
      <video id="local-video" autoplay muted playsinline></video>
    </div>
    <div>
      <p>Remote Video</p>
      <video id="remote-video" autoplay playsinline></video>
    </div>
  </div>

  <script>
    let localStream;
    const peer = new Peer();

    // 1. Acquire Local Camera and Mic
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        localStream = stream;
        document.getElementById('local-video').srcObject = stream;
      })
      .catch(err => console.error("Error accessing camera/mic:", err));

    // 2. Display assigned Peer ID
    peer.on('open', id => {
      document.getElementById('my-id').innerText = id;
    });

    // 3. Handle Incoming Call
    peer.on('call', call => {
      call.answer(localStream);
      call.on('stream', remoteStream => {
        document.getElementById('remote-video').srcObject = remoteStream;
      });
    });

    // 4. Initiate Outgoing Call
    function makeCall() {
      const remoteId = document.getElementById('peer-id').value;
      if (!remoteId) return alert("Please enter a Peer ID");
      
      const call = peer.call(remoteId, localStream);
      call.on('stream', remoteStream => {
        document.getElementById('remote-video').srcObject = remoteStream;
      });
    }
  </script>
</body>
</html>
