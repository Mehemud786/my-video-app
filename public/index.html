<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Video Call App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 10px; }
        .video-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        video { width: 450px; height: 340px; background: #1e293b; border-radius: 8px; object-fit: cover; border: 2px solid #334155; }
        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        input, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: #fff; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <h1>Python + WebRTC Video Call</h1>
    <div class="controls">
        <input type="text" id="roomInput" placeholder="Enter Room ID">
        <button onclick="startCall()">Start Local Camera</button>
        <button onclick="createOffer()">Create Offer (Caller)</button>
        <button onclick="createAnswer()">Answer Call (Receiver)</button>
    </div>

    <!-- Manual Signaling Area for P2P connection testing -->
    <div style="margin-top: 15px; width: 80%; max-width: 900px; display: flex; gap: 10px;">
        <textarea id="offerAnswerBox" placeholder="Paste SDP offer/answer here..." style="width: 100%; height: 80px; background: #1e293b; color: #fff; padding: 10px; border-radius: 5px; border: 1px solid #334155;"></textarea>
        <button onclick="addAnswer()" style="height: 100px;">Set Remote SDP</button>
    </div>

    <div class="video-container">
        <div>
            <h3>Local Stream</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Remote Stream</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream;
        let remoteStream;
        let peerConnection;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function startCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                
                peerConnection = new RTCPeerConnection(servers);
                
                // Add local tracks to peer connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                // Listen for remote tracks
                remoteStream = new MediaStream();
                document.getElementById('remoteVideo').srcObject = remoteStream;
                
                peerConnection.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                };

                // ICE candidates handling
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('New ICE candidate:', JSON.stringify(peerConnection.localDescription));
                    }
                };

                alert('Camera active and PeerConnection initialized!');
            } catch (error) {
                console.error('Error accessing media devices.', error);
                alert('Could not access webcam/microphone.');
            }
        }

        async function createOffer() {
            if (!peerConnection) {
                alert('Start local camera first!');
                return;
            }
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            document.getElementById('offerAnswerBox').value = JSON.stringify(peerConnection.localDescription);
            alert('Offer created! Copy the text above and send it to the other participant.');
        }

        async function createAnswer() {
            if (!peerConnection) {
                alert('Start local camera first!');
                return;
            }
            const text = document.getElementById('offerAnswerBox').value;
            if (!text) {
                alert('Paste the sender offer first!');
                return;
            }
            const offer = JSON.parse(text);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            document.getElementById('offerAnswerBox').value = JSON.stringify(peerConnection.localDescription);
            alert('Answer created! Copy the text above and send it back to the caller.');
        }

        async function addAnswer() {
            const text = document.getElementById('offerAnswerBox').value;
            if (!text) return;
            const description = JSON.parse(text);
            if (!peerConnection.currentRemoteDescription) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(description));
                alert('Remote description set successfully!');
            }
        }
    </script>
</body>
</html>
