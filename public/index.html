<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Python Video Call</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        .controls { display: flex; gap: 1rem; margin: 2rem 0; flex-wrap: wrap; justify-content: center; }
        .panel { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; }
        .video-grid { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
        video { width: 400px; height: 300px; background: #000; border-radius: 8px; object-fit: cover; border: 2px solid #475569; }
        input, button { padding: 0.75rem 1rem; font-size: 1rem; border-radius: 6px; border: none; }
        input { background: #0f172a; color: #fff; border: 1px solid #475569; }
        button { background: #3b82f6; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .btn-join { background: #10b981; }
        .btn-join:hover { background: #059669; }
        .btn-hangup { background: #ef4444; display: none; margin-top: 1rem; width: 100%; max-width: 300px; }
    </style>
</head>
<body>

    <h1>Direct Video Call</h1>

    <div class="controls">
        <div class="panel">
            <h3>1. Host a Call</h3>
            <input type="text" id="createRoomInput" placeholder="Enter new room name">
            <button onclick="createRoom()">Create Room</button>
        </div>
        <div class="panel">
            <h3>2. Join a Call</h3>
            <input type="text" id="joinRoomInput" placeholder="Enter existing room name">
            <button class="btn-join" onclick="joinRoom()">Join Room</button>
        </div>
    </div>

    <button class="btn-hangup" id="hangupBtn" onclick="hangUp()">End Call</button>

    <div class="video-grid">
        <div>
            <h4>You</h4>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h4>Peer</h4>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        let localStream, remoteStream, peerConnection, pollTimer;
        let activeRoomId = null;
        let isCaller = false;

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        async function initMedia() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            remoteStream = new MediaStream();
            document.getElementById('remoteVideo').srcObject = remoteStream;

            peerConnection.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && activeRoomId) {
                    sendSignal(activeRoomId, 'candidate', event.candidate);
                }
            };
        }

        async function createRoom() {
            const roomId = document.getElementById('createRoomInput').value.trim();
            if (!roomId) return alert('Enter a room name first.');
            
            activeRoomId = roomId;
            isCaller = true;

            await initMedia();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            await sendSignal(roomId, 'offer', offer);

            startPolling(roomId);
            document.getElementById('hangupBtn').style.display = 'block';
            alert(`Room '${roomId}' created. Waiting for peer...`);
        }

        async function joinRoom() {
            const roomId = document.getElementById('joinRoomInput').value.trim();
            if (!roomId) return alert('Enter a room name first.');
            
            activeRoomId = roomId;
            isCaller = false;

            await initMedia();
            document.getElementById('hangupBtn').style.display = 'block';
            
            // Poll until the host creates the offer
            pollTimer = setInterval(async () => {
                const res = await fetch(`/api/signal/${roomId}`);
                const roomData = await res.json();

                if (roomData.offer && !peerConnection.currentRemoteDescription) {
                    clearInterval(pollTimer);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));

                    roomData.candidates.forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c)));

                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    await sendSignal(roomId, 'answer', answer);

                    startPolling(roomId); // Poll for new ICE candidates
                }
            }, 2000);
        }

        async function sendSignal(roomId, type, data) {
            await fetch('/api/signal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ room_id: roomId, type: type, data: data })
            });
        }

        function startPolling(roomId) {
            pollTimer = setInterval(async () => {
                const res = await fetch(`/api/signal/${roomId}`);
                if (!res.ok) return;
                const roomData = await res.json();

                if (isCaller && roomData.answer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.answer));
                }

                if (roomData.candidates) {
                    roomData.candidates.forEach(async (c) => {
                        try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } 
                        catch (e) { /* Ignore duplicate candidates */ }
                    });
                }
            }, 2000);
        }

        async function hangUp() {
            if (activeRoomId) await fetch(`/api/signal/${activeRoomId}`, { method: 'DELETE' });
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            if (pollTimer) clearInterval(pollTimer);
            window.location.reload();
        }
    </script>
</body>
</html>
